[package]
name = "crafthub"
version = "2.2.1"
edition = "2024"
rust-version = "1.95"
description = "One-click installer and updater for the ArtCraft Crafting Apps on Linux, Windows and macOS"
license = "MIT"
repository = "https://github.com/TymonDomanko/CraftHub"
authors = ["Tymon Domanko"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

# Linux: OpenGL (works with every driver, including Mesa) and rustls (no OpenSSL needed).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
ureq = "3.4.2"

# Windows/macOS: wgpu (DirectX 12 / Metal, so no OpenGL driver needed) and the system's TLS.
[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
