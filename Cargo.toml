[package]
name = "crafthub"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "One-click installer and updater for the ArtCraft Crafting Apps on Linux"
license = "MIT"
repository = "https://github.com/TymonDomanko/CraftHub"
authors = ["Tymon Domanko"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
