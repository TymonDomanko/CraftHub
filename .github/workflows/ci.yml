name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

# contents: write lets the Windows/macOS jobs publish their window screenshot to a
# ci-screenshots/<runner> branch, so it can be looked at without downloading artifacts.
permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/install-rust.sh
      - run: cargo fmt --check
      - run: |
          for f in install.sh scripts/*.sh packaging/*/*.sh .github/scripts/*.sh; do bash -n "$f"; done

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04, app: pdfcraft, app_name: PDFCraft }
          - { name: Linux ARM64, os: ubuntu-22.04-arm, app: pdfcraft, app_name: PDFCraft }
          - { name: Windows x86_64, os: windows-latest, app: pdfcraft, app_name: PDFCraft, extra: artcraft, extra_name: ArtCraft }
          - { name: Windows ARM64, os: windows-11-arm, app: pdfcraft, app_name: PDFCraft }
          - { name: macOS Apple silicon, os: macos-14, app: pdfcraft, app_name: PDFCraft, extra: artcraft, extra_name: ArtCraft }
          - { name: macOS Intel, os: macos-15-intel, app: pdfcraft, app_name: PDFCraft }
    defaults:
      run:
        shell: bash
    env:
      # Authenticated GitHub API calls, so shared runners don't hit the rate limit.
      CRAFTHUB_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/install-rust.sh
      - name: Clippy
        run: bash .github/scripts/run.sh clippy cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: bash .github/scripts/run.sh tests cargo test --locked
      - name: Build
        run: bash .github/scripts/run.sh build cargo build --locked
      - name: End-to-end (${{ matrix.app_name }})
        run: |
          bin=target/debug/crafthub
          [ "$RUNNER_OS" = Windows ] && bin=target/debug/crafthub.exe
          bash .github/scripts/run.sh e2e bash .github/scripts/e2e.sh "$bin" "${{ matrix.app }}" "${{ matrix.app_name }}"
      - name: End-to-end (${{ matrix.extra_name }})
        if: matrix.extra
        run: |
          bin=target/debug/crafthub
          [ "$RUNNER_OS" = Windows ] && bin=target/debug/crafthub.exe
          bash .github/scripts/run.sh e2e bash .github/scripts/e2e.sh "$bin" "${{ matrix.extra }}" "${{ matrix.extra_name }}"
      - name: Screenshot
        if: runner.os != 'Linux'
        continue-on-error: true
        run: |
          bin=target/debug/crafthub
          [ "$RUNNER_OS" = Windows ] && bin=target/debug/crafthub.exe
          bash .github/scripts/screenshot.sh "$bin" screenshot.png
      - name: Publish screenshot
        if: runner.os != 'Linux' && github.event_name == 'push'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f screenshot.png ] || exit 0
          mkdir shot && cp screenshot.png shot/ && cd shot
          git init -q -b main
          git add screenshot.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com \
            commit -q -m "Craft Hub on ${{ matrix.name }} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/ci-screenshots/${{ matrix.os }}"

  # The .deb that puts Craft Hub in Software Manager, and its APT repository.
  # 22.04 is the oldest supported base (Linux Mint 21), 24.04 is Linux Mint 22's.
  deb:
    name: Linux package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 22.04 x86_64, os: ubuntu-22.04 }
          - { name: Ubuntu 24.04 ARM64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/install-rust.sh
      - run: sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils appstream dpkg-dev apt-utils
      - name: Build
        run: bash .github/scripts/run.sh build cargo build --release --locked
      - name: Install, upgrade and remove the package
        run: bash .github/scripts/run.sh deb bash .github/scripts/deb-test.sh target/release/crafthub

  macos-bundle:
    name: macOS app bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/install-rust.sh
      - run: bash .github/scripts/run.sh bundle bash packaging/macos/bundle.sh dist
      - name: Check the bundle
        run: |
          cd dist && rm -rf check && mkdir check && ditto -x -k crafthub-macos-universal.zip check
          "check/Craft Hub.app/Contents/MacOS/crafthub" --version
          plutil -lint "check/Craft Hub.app/Contents/Info.plist"
