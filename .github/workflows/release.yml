# Builds Craft Hub and publishes a GitHub release when a version tag is pushed:
#   git tag v2.0.1 && git push origin v2.0.1
# Craft Hub's "Update Craft Hub" button downloads the binary from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Linux Mint 21 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/crafthub dist/crafthub-linux-x86_64
          cd dist
          ./crafthub-linux-x86_64 --version
          sha256sum crafthub-linux-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Craft Hub ${GITHUB_REF_NAME#v}" \
            --generate-notes
