# Builds Craft Hub and publishes it as a GitHub release.
#
# Releasing a new version: bump `version` in Cargo.toml and push to main. If there's no
# release for that version yet, this builds it and publishes `v<version>` automatically.
# (Pushing a `v*` tag, or publishing a release on GitHub, also works.)
#
# Craft Hub's "Update Craft Hub" button downloads the binary from the latest release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Several triggers can fire for one version; run them one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Linux Mint 21 and newer.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null \
             | grep -qx "crafthub-linux-x86_64"; then
            echo "Release $tag already has its binary; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.version.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: cargo test --locked

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/crafthub dist/crafthub-linux-x86_64
          cd dist
          ./crafthub-linux-x86_64 --version
          sha256sum crafthub-linux-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Craft Hub ${TAG#v}" \
              --notes-file .github/release-notes.md
          fi
