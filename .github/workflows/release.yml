# Builds Craft Hub and attaches it to a GitHub release. Either:
#   - push a version tag:  git tag v2.0.1 && git push origin v2.0.1
#   - or on GitHub: Releases -> Draft a new release -> tag v2.0.1 -> Publish
# Craft Hub's "Update Craft Hub" button downloads the binary from the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# Publishing a release on GitHub can fire both triggers; run them one at a time.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Linux Mint 21 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/crafthub dist/crafthub-linux-x86_64
          cd dist
          ./crafthub-linux-x86_64 --version
          sha256sum crafthub-linux-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Craft Hub ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
